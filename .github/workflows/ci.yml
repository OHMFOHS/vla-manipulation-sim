name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Headless software rendering for MuJoCo's offscreen renderer.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (OSMesa, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libosmesa6-dev libgl1 libglu1-mesa

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests (real MuJoCo physics, headless)
        run: uv run pytest tests/integration -q

      - name: Headless simulation smoke test (language -> vision -> pick & place)
        run: uv run python scripts/run_demo.py --instruction "Move the milk first, then the cereal." --seed 10000 --log-level WARNING
