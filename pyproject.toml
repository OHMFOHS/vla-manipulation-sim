[project]
name = "vla-manipulation-sim"
version = "0.1.0"
description = "Language-guided robotic manipulation in MuJoCo/robosuite with closed-loop visual feedback, failure recovery and behavior cloning."
authors = [{ name = "Junchao Mao" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "robosuite==1.5.2",
    "mujoco>=3.3.0,<3.4",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "torch>=2.2",
    "imageio>=2.34",
    "tqdm>=4.66",
]

[project.optional-dependencies]
llm = ["anthropic>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "robotics"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that run full simulation episodes"]
addopts = "-ra"

# CPU-only PyTorch wheels on Linux (CI / servers); macOS uses the default PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
